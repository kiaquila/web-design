name: Baseline Source Verification

on:
  workflow_run:
    workflows:
      - Repository Guard
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  verify:
    name: publish-baseline-source-verification
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.pull_requests[1] == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout proposed pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .baseline-proposed
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install trusted policy dependencies
        run: npm ci --ignore-scripts --prefix .web-design/policy

      - name: Validate with trusted policy
        id: validation
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          ASSOCIATED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          GUARD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TOKEN: ${{ secrets.WEB_DESIGN_READ_TOKEN || github.token }}
        shell: bash
        # This job holds write permissions beside the isolated untrusted
        # checkout, so the guard refuses free-form shell that touches the step
        # environment files. The managed, hash-locked script performs the
        # repository-identity and run-SHA checks and writes the outputs itself.
        run: node scripts/verify-baseline-source.mjs

      - name: Publish head-bound verification check
        env:
          CONCLUSION: ${{ steps.validation.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SUMMARY: ${{ steps.validation.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            --method POST \
            -f name=baseline-source-verification \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f 'output[title]=Baseline source verification' \
            -f "output[summary]=$SUMMARY"
          [ "$CONCLUSION" = "success" ]
