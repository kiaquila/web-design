name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-guard:
    name: repository-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run repository policy
        run: node scripts/check-repository.mjs

      - name: Test repository policy
        run: node --test tests/repository-guard.test.mjs

      - name: Test retained KS production server policy
        run: node --test tests/ks-production-server-deploy.test.mjs

      - name: Test Codex gate regressions
        run: node --test tests/codex-review-gate.test.mjs
